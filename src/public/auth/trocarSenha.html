<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alterar senha - ComDoc</title><link rel="stylesheet" href="/auth/auth.css"></head><body><header class="topbar">ComDoc</header><main class="container"><form id="formSenha" class="cartao"><h1>Alterar senha</h1><p>Crie uma nova senha para continuar.</p><ul class="regras"><li>Mínimo de 7 caracteres</li><li>Pelo menos uma letra e um número</li><li>Maiúsculas e minúsculas são diferentes</li><li>Sem espaços</li></ul>
<label>Nova senha<div class="campo-senha"><input id="senha" type="password" required minlength="7" maxlength="128"><button type="button" data-mostrar-senha="senha">Mostrar</button></div></label><p id="mensagemSenha" class="mensagem-campo" role="alert"></p><label>Confirmar senha<div class="campo-senha"><input id="confirmacao" type="password" required minlength="7" maxlength="128"><button type="button" data-mostrar-senha="confirmacao">Mostrar</button></div></label><p id="mensagemConfirmacao" class="mensagem-campo" role="alert"></p><button class="botao-largo" type="submit">Alterar senha</button></form></main><script type="module" src="/auth/trocarSenha.js"></script></body></html>
