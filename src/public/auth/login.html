<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar - ComDoc</title><link rel="stylesheet" href="/auth/auth.css"></head><body>
<header class="topbar">ComDoc</header><main class="container"><form id="formLogin" class="cartao"><h1>Entrar</h1><p>Acesse sua empresa para criar documentos comerciais.</p>
<label>E-mail<input id="email" type="email" autocomplete="username" required></label>
<label>Senha<div class="campo-senha"><input id="senha" type="password" autocomplete="current-password" required><button type="button" data-mostrar-senha="senha">Mostrar</button></div></label><p id="mensagem" class="mensagem-campo" role="alert"></p>
<label class="check"><input id="manter" type="checkbox"> Manter conectado</label><button class="botao-largo" type="submit">Entrar</button></form></main>
<script type="module" src="/auth/login.js"></script></body></html>
