<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários - ComDoc</title><link rel="stylesheet" href="/auth/auth.css"><link rel="stylesheet" href="/usuarioAdmin/usuarioAdmin.css"><link rel="stylesheet" href="/shared/adminMenu.css"></head><body><header class="topbar"><div>ComDoc</div><div class="menu-administracao"><button class="botao-menu-admin" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuUsuarios">⋮</button><nav id="menuUsuarios" class="opcoes-menu-admin" hidden><a href="/admin/empresa">Empresa</a><a href="/admin/clientes">Clientes</a><a href="/admin/produtos">Produtos</a><a href="/">Nova cotação</a></nav></div></header><main class="usuarios-container"><header class="cabecalho"><div><h1>Usuários</h1><p>Gerencie os acessos ao ComDoc.</p></div><button id="novo" type="button">Novo usuário</button></header><p id="mensagem" class="mensagem"></p><div id="lista" class="usuarios-lista"></div>
<form id="formUsuario" class="cartao" hidden><h2 id="tituloForm">Novo usuário</h2><input id="idUsuario" type="hidden"><label>Nome<input id="nome" required maxlength="150"></label><p id="mensagemNome" class="mensagem-campo"></p><label>E-mail<input id="email" type="email" required maxlength="200"></label><p id="mensagemEmail" class="mensagem-campo"></p><label id="campoEmpresa">Empresa<select id="idEmpresa"></select></label><label>Perfil<select id="perfil"><option value="VENDEDOR">Vendedor</option><option value="ADMIN">Administrador</option><option value="SUPER">Superusuário</option></select></label><label id="campoBloqueio">Bloqueio temporário<input id="bloqueadoAte" type="text" readonly></label><button id="removerBloqueio" type="button" class="secundario" hidden>Remover bloqueio</button><label id="campoSenha">Senha provisória<input id="senha" type="password" minlength="7"></label><p id="mensagemSenha" class="mensagem-campo" role="alert"></p><label class="check"><input id="ativo" type="checkbox" checked> Ativo</label><label class="check"><input id="trocarSenha" type="checkbox" checked> Exigir troca de senha</label><div class="acoes"><button type="button" id="cancelar" class="secundario">Cancelar</button><button type="submit">Salvar</button></div></form><button id="voltar" type="button" class="secundario">Voltar</button></main><script src="/shared/adminMenu.js"></script><script type="module" src="/usuarioAdmin/usuarioAdmin.js"></script></body></html>
