<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar minha conta - ComDoc</title><link rel="stylesheet" href="/publico/publico.css"></head><body>
<header class="topo-publico"><a class="marca" href="/">ComDoc</a><nav class="navegacao"><a href="/login">Entrar</a></nav></header><main class="formulario-publico"><form id="formCadastro"><section class="secao-formulario"><h1>Criar minha conta</h1><p>Informe os dados básicos da empresa e do primeiro administrador.</p></section>
<section class="secao-formulario"><h2>Empresa</h2><div class="campos duas-colunas"><div class="campo largo"><label for="nome">Razão social</label><input id="nome" maxlength="150" required></div><div class="campo"><label for="nomeFantasia">Nome fantasia</label><input id="nomeFantasia" maxlength="150" required></div><div class="campo"><label for="cnpj">CNPJ</label><input id="cnpj" inputmode="numeric" maxlength="18" required></div><div class="campo"><label for="emailEmpresa">E-mail da empresa</label><input id="emailEmpresa" type="email" maxlength="150" required></div><div class="campo"><label for="telefone">Telefone</label><input id="telefone" inputmode="tel" maxlength="15"></div><div class="campo"><label for="whatsapp">WhatsApp</label><input id="whatsapp" inputmode="tel" maxlength="15"></div></div></section>
<section class="secao-formulario"><h2>Endereço</h2><div class="campos duas-colunas"><div class="campo largo"><label for="logradouro">Logradouro</label><input id="logradouro" maxlength="150" required></div><div class="campo"><label for="numeroEndereco">Nro.</label><input id="numeroEndereco" maxlength="20" required></div><div class="campo"><label for="complemento">Complemento</label><input id="complemento" maxlength="80"></div><div class="campo"><label for="bairro">Bairro</label><input id="bairro" maxlength="100" required></div><div class="campo"><label for="cidade">Cidade</label><input id="cidade" maxlength="100" required></div><div class="campo"><label for="uf">UF</label><input id="uf" maxlength="2" required></div><div class="campo"><label for="cep">CEP</label><input id="cep" inputmode="numeric" maxlength="9" required></div></div></section>
<section class="secao-formulario"><h2>Administrador</h2><div class="campos duas-colunas"><div class="campo"><label for="nomeAdmin">Nome</label><input id="nomeAdmin" maxlength="150" autocomplete="name" required></div><div class="campo"><label for="emailAdmin">E-mail de acesso</label><input id="emailAdmin" type="email" maxlength="150" autocomplete="username" required></div><div class="campo"><label for="senha">Senha</label><input id="senha" type="password" minlength="7" maxlength="128" autocomplete="new-password" required></div><div class="campo"><label for="confirmacaoSenha">Confirme a senha</label><input id="confirmacaoSenha" type="password" minlength="7" maxlength="128" autocomplete="new-password" required></div></div><small>A senha deve ter ao menos sete caracteres, uma letra e um número, sem espaços.</small></section>
<section class="secao-formulario"><label class="linha-check"><input id="aceitouTermos" type="checkbox" required><span>Li e aceito os <a href="/termos-de-uso" target="_blank">Termos de Uso</a> <strong id="versaoTermos"></strong>.</span></label><label class="linha-check"><input id="aceitouPrivacidade" type="checkbox" required><span>Li e aceito a <a href="/politica-de-privacidade" target="_blank">Política de Privacidade</a> <strong id="versaoPrivacidade"></strong>.</span></label><p id="mensagem" class="mensagem" role="alert"></p><div class="acoes-formulario"><a class="botao-secundario" href="/">Voltar</a><button id="enviar" type="submit">Criar minha conta</button></div></section></form></main><script type="module" src="/publico/cadastro.js"></script></body></html>
